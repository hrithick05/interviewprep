services:
  - type: web
    name: interview-prep-pro
    env: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    releaseCommand: python manage.py migrate --noinput
    startCommand: gunicorn interview_prep.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

databases:
  - name: interviewprep-db
    databaseName: interviewprep
    user: interviewprep
