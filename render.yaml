services:
  - type: web
    name: prepforge-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build -w @prepforge/shared && npm run build -w @prepforge/server
    startCommand: npm run start -w @prepforge/server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
